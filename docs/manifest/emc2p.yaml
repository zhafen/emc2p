file_info:
    - description: >
          Architecture/backlog notes for emc2p itself, following the same
          requirement/solution convention as iacs's and story-simulator's
          own project manifests. Kept under docs/, not this package's own
          builtins/ (which every registry.update() call merges in as
          schema) or manifest/ -- this directory is for architecture
          review, not merged into every registry. History that isn't
          itself a requirement/solution lives in history.yaml, kept
          separate so it isn't scanned in as part of assessing
          requirements/solutions.
    - file_info

deduplication_tool:
    - description: >
          scripts/find_duplicate_component_types.py, exposed as an MCP
          tool so a connected agent can run the duplicate-component-type
          check directly instead of a maintainer running the script by
          hand.
    - solution

getter_api_design:
    data:
        - description: >
              How Registry's getter methods (get/view/view_current/
              safe_view/safe_view_current/get_current_value, and a
              potential get_current_values) should be named, layered,
              and whether a batch "many aliases, one field, decoded to
              a dict" convenience method should exist. Tagged `mission`
              so audit.report's requirement tree scopes to just this
              subtree -- the only mission tag in this file today, so
              this is a deliberate, not yet load-bearing, choice.
        - mission

    naming_signals_error_handling_contract:
        data:
            - description: >
                  A reader should be able to tell whether a getter
                  raises KeyError or returns None/empty without
                  reading its implementation. Current names: get_*
                  never raises (get, get_entity_id, get_current_value);
                  view*/safe_view* raise/don't-raise as a matched pair.
                  Verified against entt (skypjack/entt): try_get is the
                  real ECS-world precedent for the raise/safe split,
                  named try_, not safe_ -- and only exists at
                  entity+component granularity, with no equivalent of
                  "this component type is unknown to the registry at
                  all" (moot in entt's static type system). See
                  history.yaml for the full research.
            - requirement_priority:
                  type: quality
                  value: 0.5
            - requirement

        document_the_implicit_get_vs_view_rule:
            - description: >
                  State the rule explicitly on the Registry class
                  docstring: get_* methods never raise and carry no
                  safe_ sibling by contract (there's nothing for safe_
                  to distinguish them from); view*/safe_view*
                  raise/don't-raise as a pair. No renames -- current
                  names already satisfy this rule, it was just never
                  written down.
            - solution:
                  selected: true
            - impact:
                  value: 0.5
            - cost:
                  value: 1
            - consideration_rating:
                  value: no_new_names_to_learn
                  rating: 0.7
                  note: Zero migration cost, no call sites change.
            - consideration_rating:
                  value: rule_discoverable_from_name_alone
                  rating: -0.3
                  note: >
                      Still relies on a reader finding and reading that
                      one docstring paragraph, not the name alone.
            - pro: Zero migration cost -- no call sites change.
            - con: >
                  Still relies on a reader finding and reading the
                  docstring paragraph, not the name alone.

        rename_to_include_safe_prefix:
            - description: >
                  Rename get_current_value(s) to
                  safe_get_current_value(s) so the never-raises
                  contract is explicit in the name itself.
            - solution
            - impact:
                  value: 0.2
            - cost:
                  value: 2
            - consideration_rating:
                  value: no_new_names_to_learn
                  rating: -0.6
                  note: Every call site (3+ in story-simulator alone) needs updating.
            - consideration_rating:
                  value: rule_discoverable_from_name_alone
                  rating: 0.5
                  note: >
                      Redundant given get_* never has a raising sibling
                      to distinguish itself from in the first place.
            - pro: Makes the never-raises contract explicit in the name itself.
            - con: >
                  Every call site (3+ in story-simulator alone) needs
                  updating for no new information, since get_* never
                  had a raising sibling to distinguish from.

    naming_axis:
        - consideration:
              value: no_new_names_to_learn
              weight: 0.6
              description: Cost of callers/readers learning or migrating to a new name.
        - consideration:
              value: rule_discoverable_from_name_alone
              weight: 0.4
              description: Whether the contract is legible from the name itself vs. needing documentation.

    batch_current_value_reads:
        data:
            - description: >
                  Getting the current value of one field for many
                  aliases at once, decoded to plain Python rather than
                  a DataFrame the caller has to unpack themselves.
                  Directly observed, not hypothetical: the same
                  dict(zip(...)) pattern independently reimplemented at
                  least 3x in story-simulator (_event_states, the old
                  _location, _placement's dict comprehension). Checked
                  entt for precedent: no batch-get equivalent exists
                  there by design -- documented idiom is "iterate the
                  view yourself," a real data point weighed below.
            - requirement_priority:
                  type: quality
                  value: 0.6
            - requirement

        add_get_current_values_method:
            - description: >
                  New sibling method, dict-returning:
                  get_current_values(component_type, field, aliases) ->
                  dict[str, Any]. Not a flag/overload on
                  get_current_value itself.
            - solution:
                  selected: true
            - impact:
                  value: 0.7
            - cost:
                  value: 3
            - consideration_rating:
                  value: no_boolean_trap
                  rating: 0.8
                  note: Return type is always dict regardless of alias count -- no input-shape-dependent return type.
            - consideration_rating:
                  value: eliminates_observed_boilerplate
                  rating: 0.8
                  note: Directly replaces the repeated dict(zip(...)) pattern at its 3+ known call sites.
            - consideration_rating:
                  value: entt_precedent
                  rating: -0.5
                  note: >
                      entt has no batch-get equivalent by design --
                      documented idiom is "iterate the view yourself."
                      This solution goes against that grain.
            - consideration_rating:
                  value: api_surface_growth
                  rating: -0.3
                  note: One more method on an already-large class.
            - pro: Return type is always a dict regardless of alias count -- no boolean trap.
            - con: >
                  Goes against entt's own documented idiom of iterating
                  the view yourself rather than adding a batch-get
                  helper.

        overload_get_current_value_on_list_input:
            - description: >
                  get_current_value returns a scalar for a single
                  alias, a dict/list when given a list of aliases --
                  same method name, return type branches on input
                  shape.
            - solution
            - impact:
                  value: 0.6
            - cost:
                  value: 1
            - consideration_rating:
                  value: no_boolean_trap
                  rating: -0.9
                  note: >
                      Exactly the failure mode this axis is named for --
                      a single-element list returns a different TYPE
                      than the bare string does.
            - consideration_rating:
                  value: eliminates_observed_boilerplate
                  rating: 0.6
                  note: Would also replace the dict-building boilerplate, if the type instability were acceptable.
            - consideration_rating:
                  value: entt_precedent
                  rating: 0.0
                  note: No direct entt equivalent either way.
            - consideration_rating:
                  value: api_surface_growth
                  rating: 0.5
                  note: No new method name at all.
            - pro: No new method name needed at all.
            - con: >
                  A single-element list returns a different type than
                  the bare string does -- the exact boolean-trap failure
                  mode.

        extend_view_with_safe_flag:
            - description: >
                  Add safe=True to view/view_current instead of the
                  separate safe_view/safe_view_current methods actually
                  shipped -- a previously-considered alternative to the
                  design already implemented.
            - solution
            - impact:
                  value: 0.3
            - cost:
                  value: 2
            - consideration_rating:
                  value: no_boolean_trap
                  rating: -0.7
                  note: >
                      Same problem one level up: safe=True would have
                      to also change the return type from ibis.Table to
                      pd.DataFrame | None, a second axis of
                      shape-instability gated on a runtime bool.
            - consideration_rating:
                  value: eliminates_observed_boilerplate
                  rating: -0.4
                  note: Doesn't address the dict-decoding pain at all -- still returns a table/DataFrame, not a dict.
            - consideration_rating:
                  value: entt_precedent
                  rating: 0.0
                  note: Not applicable -- entt has no view/safe_view distinction at all.
            - consideration_rating:
                  value: api_surface_growth
                  rating: 0.4
                  note: No new method name; already superseded by the separate safe_view/safe_view_current methods actually shipped.
            - pro: No new method name; reuses the existing view/view_current entry points.
            - con: >
                  safe=True would have to change the return type from
                  ibis.Table to pd.DataFrame | None -- the same boolean
                  trap one level up.

        no_batch_helper_iterate_view_yourself:
            - description: >
                  Don't add get_current_values at all -- every caller
                  builds its own dict from safe_view_current(...)'s
                  DataFrame, the way most call sites already do today.
                  The entt-idiomatic answer.
            - solution
            - impact:
                  value: 0.1
            - cost:
                  value: 0
            - consideration_rating:
                  value: no_boolean_trap
                  rating: 0.5
                  note: No new method, so nothing to have a type-instability problem.
            - consideration_rating:
                  value: eliminates_observed_boilerplate
                  rating: -0.9
                  note: The opposite of eliminating it -- leaves the repeated pattern exactly as-is.
            - consideration_rating:
                  value: entt_precedent
                  rating: 0.9
                  note: Directly matches entt's own documented ECS idiom -- view is the batch primitive, iterate it yourself.
            - consideration_rating:
                  value: api_surface_growth
                  rating: 0.9
                  note: Zero new surface.
            - pro: >
                  Directly matches entt's own documented ECS idiom --
                  view is the batch primitive, iterate it yourself.
            - con: >
                  Leaves the repeated dict(zip(...)) pattern,
                  independently reimplemented 3+ times in
                  story-simulator, exactly as it is.

    batch_axis:
        - consideration:
              value: no_boolean_trap
              weight: 0.9
              description: Return type must not depend on the runtime shape of the input.
        - consideration:
              value: eliminates_observed_boilerplate
              weight: 0.7
              description: Removes the specific dict(zip(...)) pattern independently reimplemented 3+ times in story-simulator.
        - consideration:
              value: entt_precedent
              weight: 0.3
              description: Alignment with entt's own documented ECS idiom for batch reads.
        - consideration:
              value: api_surface_growth
              weight: 0.2
              description: Cost of one more method on an already-large class.
