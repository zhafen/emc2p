file_info:
    - description: >
          Architecture/backlog notes for emc2p itself, following the same
          requirement/solution convention as iacs's and story-simulator's
          own project manifests. Kept under docs/, not this package's own
          builtins/ (which every registry.update() call merges in as
          schema) or manifest/ -- this directory is for architecture
          review, not merged into every registry. History that isn't
          itself a requirement/solution lives in history.yaml, kept
          separate so it isn't scanned in as part of assessing
          requirements/solutions.
    - file_info

deduplication_tool:
    - description: >
          scripts/find_duplicate_component_types.py, exposed as an MCP
          tool so a connected agent can run the duplicate-component-type
          check directly instead of a maintainer running the script by
          hand.
    - solution

getter_api_design:
    getter_api_requirements:
        data:
            - description: >
                Each of the requirements is an axis with multiple sub requirements. We
                need a solution for every combination of sub requirements, assuming only
                one sub requirement needs to be met at a time for a given axis.  For
                example, we need to a solution for the combination of
                implementation_details.interface,
                output_granularity.components_selection output_format.ibis_table,
                scd_data.current_data, error_handling.raises_errors, and
                entity_specification_method.entity_alias.  However, some combinations
                will not be relevant (e.g. tabular_output_format for one field on one
                entity), and we want to focus solution coverage on requirement
                combinations that are more likely to be used.

                The full, pruned enumeration of these combinations (216 total,
                treating output_format at its top level only for now -- not its
                individual leaf formats) is written out in
                docs/manifest/getter_api_combinations.md, along with an assessment
                of how well getter_api_solutions covers them. Kept as a separate
                file rather than inline here for the same reason history.yaml is
                separate: it isn't itself a requirement/solution, just supporting
                detail. Manually enumerated, not auto-generated -- see
                zhafen/iacs#108 for why a general combinatorial-generation
                mechanism (a requirement_combination component plus a recursive
                resolver) was scoped out as overengineering for a problem hit once.
            - requirement
        implementation_details:
            data:
                - description: >
                    For each requirement, we need to handle various aspects of the
                    implementation.
                - requirement
            interface:
                - description: How the user specifies their selection.
                - requirement
            implementation:
                - description: How the mechanics work.
                - requirement.
        output_granularity:
            data:
                - description: Enable access for different levels of granularity.
                - requirement
            raw_data:
                - description: >
                    Access to a single component tables with no transformations applied.
                    Acts as a source of truth.
                - requirement
            components_selection:
                - description: >
                    Choose which components to select, and the type of join. Always join on
                    entity_id.
                - requirement
            entities_selection:
                - description: >
                    Choose the entities to retrieve the data for.
                - requirement
            field_selection:
                - description: >
                    Choose the fields in different components to retrieve the data for.
                - requirement
        output_format:
            data:
                - description: >
                    Enable different types of output, as relevant for a given output data
                    structure. We want users to be able to easily use our output.
                - requirement
            tabular_output_formats:
                data:
                    - description: >
                        The output formats that should be possible for tabular data.
                    - requirement
                ibis_tables:
                    - requirement
                pandas_dataframes:
                    - requirement
            row_or_column_output_formats:
                data:
                    - description: >
                        The output formats that should be possible for tabular data.
                    - requirement
                pandas_series:
                    - requirement
                dictionary_of_values:
                    - requirement
                list_of_values:
                    - description: Assumes IDs at the same indices.
                    - requirement
            constant_output_formats:
                - description: Output for all base types, e.g. string, int, etc.
                - requirement
            entity_first_output_formats:
                - description: >
                    JSON-like, nested-dictionary output keyed by entity first (e.g.
                    {entity_id: {component: value, ...}}), mirroring iacs's
                    entity-centered (EC) format rather than emc2p's own
                    component-centered/tabular registry format. Unlike
                    tabular_output_formats, this stays valid even for raw_data -- a
                    whole component table can be re-expressed entity-first without
                    any selection/join happening.
                - requirement
            pretty_printed_output_formats:
                - description: >
                    Human-readable formatted text (e.g. an ASCII table, a labeled
                    block for a single entity, a labeled scalar) for direct
                    display/narration rather than further programmatic processing.
                    Orthogonal to the other format categories in a different way
                    than they're orthogonal to each other: it's a rendering choice
                    that applies regardless of output_granularity/output_singularity,
                    rather than a structural alternative that only fits some of them.
                - requirement
        output_singularity:
            data:
                - description: >
                    A modifier on whichever output_format is chosen (e.g. "ibis_tables,
                    singular" vs. "ibis_tables, plural"), not a peer alternative within
                    output_format's own format-category list. For each case where data
                    is output at a given granularity, we want to handle the special
                    "single" case that has output one level down. For example, if we're
                    looking at multiple components where our entity_selection is a
                    single entity, we don't want a tabular output, but instead a
                    row-like output format.
                - requirement
            single_version_of_output:
                - requirement
            multiple_version_of_output:
                - requirement
        scd_data:
            data:
                - description: >
                    We need to enable access to both all slowly-changing-dimension data
                    and only the current data.
                - requirement
            full_history:
                - requirement
            current_data:
                - requirement
        error_handling:
            data:
                - description: >
                    We need to enable both access that raises errors and access that doesn't.
                - requirement
            raises_errors:
                - requirement
            returns_empty_or_null_objects:
                - requirement
        entity_specification_method:
            data:
                - description: >
                    We need to be able to provide access to data given a variety of ways
                    entities are specified.
                - requirement
            entity_id:
                - description: The easiest option.
                - requirement
            entity_path:
                - description: Slightly harder, but still guaranteed unique.
                - requirement
            entity_alias:
                - description: >
                    Easiest to use but hardest to implement. Requires path resolution.
                - requirement
    getter_api_solutions:
        data:
            - description: >
                Each entry here is one mechanism for how a caller selects a single
                axis's value, not a complete getter API on its own -- the actual
                API will very likely hybridize several of these, using a
                different mechanism per axis (or per group of axes) rather than
                one mechanism for everything. See
                docs/manifest/getter_api_combinations.md for an axis-by-axis
                evaluation of how well each mechanism fits each requirement axis,
                as input to deciding how to hybridize them.
            - requirement
        parameter_specification_via_method_name:
            - description: >
                The axis value is baked into the method's own name as a
                word/prefix/suffix. For example, the "safe_" prefix in front of a
                method means that method will not raise errors.
        parameter_specification_via_argument:
            - description: >
                The axis value is passed as an explicit named parameter on the
                call. For example, passing raise_errors=False as an argument
                means that call will not raise errors.
        parameter_specification_via_chained_accessor:
            - description: >
                A fluent chain of narrowing sub-objects/properties selects the
                axis value before the terminal call, e.g.
                registry.entities.current.safe.get_by_alias(...) rather than one
                flat method name or a kwarg.
        parameter_specification_via_type_based_dispatch:
            - description: >
                The type of a single positional argument -- not its name or an
                explicit flag -- determines which axis value applies. E.g.
                passing an EntityAlias("foo") object vs. a plain entity_id int
                lets the same get() infer entity_specification_method from what
                was handed to it, with no separate flag needed.
        parameter_specification_via_result_object:
            - description: >
                The getter always returns one generic/lazy result object, and the
                axis value is chosen afterward via a method/property called on
                that result rather than an argument to the getter call itself,
                e.g. get_component(...).to_pandas() / .pretty_print().
        parameter_specification_via_configuration_object:
            - description: >
                Several axis choices are bundled into one settings/spec object,
                built once and reused across calls, e.g.
                get(entity, options=GetterOptions(scd="current",
                raise_errors=False)), rather than separate individual kwargs
                repeated at every call site.