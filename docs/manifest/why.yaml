file_info:
    - description: >
          A "why chain" experiment: starting from one real method
          (``McpClientSession.send_turn``, in
          emc2p/testing/mcp_client_session.py), repeatedly ask "why" and
          record each answer as its own standalone concept entity. Each
          concept points back at whatever it explains via ((why)), with
          the specific question it's answering on ((why)).question and any
          cross-references or caveats on ((why)).note -- kept out of the
          concept's own ``description`` so that description reads as a
          self-contained statement of the idea, not a pointer to some
          other entity in this file. A concept reused as the answer to
          more than one question (or more than one target) carries
          multiple ((why)) rows rather than being restated as a near-
          duplicate entity. Not itself a requirement/solution manifest
          entry -- kept separate from emc2p.yaml/history.yaml the same way
          those already separate architecture notes from pure history.
    - file_info

why:
    - description: >
          A directed_relation from an entity that answers "why" (the
          ((why)).source) back to the entity whose existence it explains
          (the ((why)).value) -- the same source/value shape as
          ((solution)), but for an open-ended rationale chain rather than
          a formal requirement/solution pairing. One source entity can own
          several ((why)) rows, each with its own value/question/note, when
          the same concept is the answer to more than one question.
    - parent: directed_relation
    - field:
          value:
              description: The entity this why-answer explains.
              type: entity_ref
          question:
              description: >
                  The particular "why" question this row answers -- lets
                  one concept entity be the answer to several distinct
                  "why" questions (about the same target, or about several
                  different targets), each recorded as its own ((why)) row
                  rather than forcing a separate, near-duplicate entity per
                  question.
              type: str
          note:
              description: >
                  Optional free-text aside about this row -- a caveat, a
                  concrete example, or where this concept is also used
                  elsewhere in the chain. Kept separate from the source
                  entity's own ``description`` so that description stays a
                  self-contained statement of the concept itself, not
                  prose that reaches outside the entity to reference
                  another why-entity by name.
              type: str
              nullable: true

mcp_client_session_send_turn:
    - description: >
          ``McpClientSession.send_turn(prompt)`` in
          emc2p/testing/mcp_client_session.py: sends one prompt on the
          session's ongoing conversation and blocks (on the caller's
          thread) until the model<->tool-call exchange for that turn
          finishes, returning the final reply. Internally submits the
          work to the session's single background asyncio task (via a
          thread-safe queue + concurrent.futures.Future) so the real
          `mcp.ClientSession` and `run_tool_calling_loop` machinery stay
          on the one task that opened them, and appends every model
          response and tool call/result to `self.trace_path` as it
          happens.

# ---------------------------------------------------------------------------
# Concepts. Each description stands on its own; connections between
# concepts live only in the `why of` edges below (value/question/note),
# never in the description text itself.
# ---------------------------------------------------------------------------

sync_call_matches_session_shape:
    - description: >
          A plain, synchronous call that blocks until a turn's reply is
          ready and matches `HeadlessSession.send_turn`'s own public shape
          (context manager, one call per turn, `usage_summary`,
          `trace_path`, `turn_timeout`/`session_timeout`) -- callers use
          it exactly like any other function call, with no async syntax
          of their own.
    - why of:
        - value: mcp_client_session_send_turn
          question: Why does `send_turn` exist as a method?
        - value: mcp_client_session_send_turn
          question: Why is `send_turn` a synchronous, blocking call rather than an `async def` method?

drop_in_backend_replacement:
    - description: >
          Keeping a class's public interface identical to one callers
          already construct lets them swap in a different backend without
          changing anything about how they call it -- same construction,
          same methods, same return values, same internally-managed
          state.
    - why of:
        - value: sync_call_matches_session_shape
          question: Why does that call need to match `HeadlessSession.send_turn`'s own shape specifically?
        - value: history_owned_internally
          question: Why is conversation history owned and threaded internally rather than passed back in by the caller on every call?

duplicate_test_surfaces_waste_effort:
    - description: >
          Requiring a different calling convention for what is otherwise
          the same set of tests means writing and maintaining two parallel
          test surfaces side by side, for no benefit to what the tests
          actually check.
    - why of:
          value: drop_in_backend_replacement
          question: Why must the interface be preserved rather than adapting existing callers to a new one?

model_without_bundled_agent_cli:
    - description: >
          A model reachable only through a generic API client library,
          with no bundled command-line tool of its own that already pairs
          a protocol client with an agent loop the way some providers
          ship.
    - why of:
          value: mcp_client_session_send_turn
          question: Why is a from-scratch client needed at all, instead of always driving models through an existing provider-CLI-based session?
          note: >
              Concrete example at the time this was written: DeepSeek's
              own CLI, `dsh`, was a week-old one-shot-only preview with no
              documented streaming output or usage reporting.

untested_model_cannot_be_trusted_live:
    - description: >
          A model that has never been exercised through the real tool
          surface in an actual live turn can't be trusted to behave
          correctly once it genuinely is.
    - why of:
          value: model_without_bundled_agent_cli
          question: Why must a model without a bundled CLI still be run through live-behavior tests?

real_protocol_makes_tests_trustworthy:
    - description: >
          Exercising the real wire protocol and the exact tool schemas a
          connected client would see -- rather than a hand-mirrored copy
          of them -- is what makes a live test's result trustworthy; a
          mismatch between a stand-in and the real thing would otherwise
          go undetected.
    - why of:
          value: untested_model_cannot_be_trusted_live
          question: Why must that live exercise go through the real protocol rather than a hand-mirrored mock of the tool schemas?

hand_maintained_mocks_drift:
    - description: >
          A hand-mirrored copy of a schema lives and changes independently
          of the real one it's supposed to mirror; nothing forces it to be
          updated in lockstep when the real one changes, so it silently
          goes stale.
    - why of:
          value: real_protocol_makes_tests_trustworthy
          question: Why would a hand-mirrored schema copy drift from the real one?

testing_real_thing_sidesteps_sync:
    - description: >
          Exercising real behavior directly, rather than maintaining a
          synthetic stand-in for it, avoids ever needing a separate
          mechanism to keep that stand-in synchronized with the thing it's
          meant to represent.
    - why of:
          value: hand_maintained_mocks_drift
          question: Why rely on live exercise instead of building a mechanism that keeps a mock schema in sync automatically?

mission_requires_confirmed_real_behavior:
    - description: >
          A tool's value can only be confirmed by how it actually behaves
          when a real client drives it; a synthetic stand-in only tests
          assumptions about that behavior, never the behavior itself.
    - why of:
          value: testing_real_thing_sidesteps_sync
          question: Why prioritize real, interpretable live behavior over synthetic/mocked correctness at all?
          note: >
              Terminus: a foundational project goal (emc2p's own mission,
              `tool_for_data_driven_mcps` in docs/manifest/emc2p.yaml),
              not itself something with a further "why" behind it.

test_should_focus_on_scenario_not_plumbing:
    - description: >
          The value of a test lies in the scenario and behavior it
          exercises; pushing incidental implementation mechanics -- async
          syntax, event-loop management, message-history bookkeeping --
          into the test itself dilutes that focus without checking
          anything extra.
    - why of:
        - value: sync_call_matches_session_shape
          question: Why avoid requiring async syntax (`async def test_...`) in caller/test code?
        - value: drop_in_backend_replacement
          question: Why should callers be freed from message-history bookkeeping themselves, rather than it being a normal part of writing a live test?

history_owned_internally:
    - description: >
          The ongoing conversation's accumulated message history is
          threaded and owned internally by whatever is driving the model,
          not passed in by the caller on every call -- a caller only ever
          supplies the next new input.
    - why of:
          value: mcp_client_session_send_turn
          question: "Why does `send_turn` take a single `prompt: str` argument rather than a structured message/history object?"

single_shared_background_task_reuses_connection:
    - description: >
          Routing every call's async work through one already-running
          background task -- via a thread-safe queue and a future
          bridging the result back to the caller's own thread -- lets one
          already-open client connection be reused across every call,
          instead of opening (and paying the cost of) a fresh one each
          time.
    - why of:
          value: sync_call_matches_session_shape
          question: Why does making the call synchronous require routing through a single shared background task, instead of the call just running its own event loop?

cancel_scope_bound_to_owning_task:
    - description: >
          A cancel scope opened by one task must also be exited by that
          same task; using the connection it guards from a different task
          raises an error, so a connection's whole lifetime -- open, every
          use, close -- has to run inside one consistent task.
    - why of:
          value: single_shared_background_task_reuses_connection
          question: Why must the connection stay on the one already-running task instead of a fresh task per call?
          note: "Concretely, `mcp`'s stdio transport opens an anyio task group at connect time."

structured_concurrency_ties_cancellation_to_task_stack:
    - description: >
          A structured-concurrency model ties a cancellation scope to the
          call stack of the task that opened it, so cancellation can be
          delivered and unwound deterministically through that stack; a
          different task closing a scope it never entered would break
          that guarantee.
    - why of:
          value: cancel_scope_bound_to_owning_task
          question: Why must a cancel scope be entered and exited on the same task in the first place?
          note: >
              Terminus: a hard constraint of the underlying anyio library,
              not a choice made by this project -- not itself negotiable
              from the code using it.

trace_as_durable_debug_record:
    - description: >
          A durable, turn-by-turn record of what a model and its tools
          actually did -- not just the final reply -- lets a failure be
          diagnosed after the fact from what really happened, including
          work done by any calls nested inside the turn.
    - why of:
        - value: mcp_client_session_send_turn
          question: Why does `send_turn` write every model response and tool call/result to a trace file as it happens?
        - value: mcp_client_session_send_turn
          question: Why would a nested call ever need to write into the same trace file as the outer call, rather than its own separate file?

live_runs_are_costly_to_reproduce:
    - description: >
          A live run against a real model is expensive and
          non-deterministic to reproduce; being able to point a failure
          report at a durable record of what happened avoids needing to
          re-run the very call that just failed.
    - why of:
          value: trace_as_durable_debug_record
          question: Why does diagnosing a failure need a full turn-by-turn record rather than just the final reply or error?

turn_has_multiple_fallible_steps:
    - description: >
          A single turn can drive several model calls and tool calls in
          sequence against a real, networked service; any one of them can
          time out or error after earlier steps in that same turn already
          ran and had real side effects.
    - why of:
          value: live_runs_are_costly_to_reproduce
          question: Why would a turn's activity matter to a debugging record if the turn doesn't necessarily succeed or fail as one atomic unit?

incremental_durable_writes_survive_failure:
    - description: >
          Writing and flushing each event as it happens, rather than
          buffering until the end, guarantees that whatever already
          occurred is durably recorded by the time anything later in the
          same turn fails.
    - why of:
          value: turn_has_multiple_fallible_steps
          question: Why write the record incrementally, entry by entry, instead of buffering it and writing once at the end of the turn?

append_mode_avoids_clobbering_concurrent_writers:
    - description: >
          A write-mode file handle's write position tracks independently
          of the file's actual growth; when more than one process or
          handle can write to the same file, an outdated write position
          from one of them can silently overwrite what another writer
          already appended. Opening a shared file in append mode instead
          guarantees every write from any handle lands at the file's true
          current end.
    - why of:
          value: incremental_durable_writes_survive_failure
          question: Why is the trace file opened in append mode specifically, rather than write mode?
          note: >
              Discovered when a nested in-process call writing to the
              same trace path had its output silently clobbered by the
              outer handle's next write (see docs/manifest/history.yaml:
              project_history.trace_file_opened_in_append_mode).

deadline_is_tighter_of_two_budgets:
    - description: >
          When two separate time budgets both apply to the same
          operation -- one scoped to the operation itself, one scoped to a
          larger unit of work it's part of -- the operation's real
          deadline is whichever of the two runs out first.
    - why of:
          value: mcp_client_session_send_turn
          question: Why does `send_turn` compute its deadline as the minimum of a per-turn timeout and a per-session timeout, rather than enforcing the per-turn timeout alone?

aggregate_budget_guards_against_runaway_total:
    - description: >
          A budget scoped to a whole sequence of operations, not just one
          of them, catches a total that grows unbounded across many
          individually well-behaved operations -- something a limit on
          any single operation alone can't catch.
    - why of:
          value: deadline_is_tighter_of_two_budgets
          question: Why have a budget scoped to the whole session at all, separate from each individual turn's own budget?

live_tests_must_stay_bounded_to_stay_sparing:
    - description: >
          Real API calls cost real usage and are flaky by nature, so a
          live test suite is meant to be run deliberately and sparingly;
          letting its total cost or runtime grow unbounded -- even with no
          single call ever timing out -- would defeat that intent.
    - why of:
          value: aggregate_budget_guards_against_runaway_total
          question: Why is it important to cap total live-test cost/time at all, rather than trusting individual limits to keep things bounded?

untested_guarantees_are_worthless:
    - description: >
          A guarantee that depends on a test suite actually being run is
          only as credible as whether that suite keeps getting run; if
          running it became too expensive or open-ended for anyone to
          actually do so, the guarantee it was meant to provide would go
          unverified in practice.
    - why of:
          value: live_tests_must_stay_bounded_to_stay_sparing
          question: Why does keeping live-test cost/time bounded matter to the project at all?

session_scoped_state_must_persist_across_calls:
    - description: >
          A connection, an open file handle, and a set of running totals
          only stay meaningful if the same instance holding them is
          reused for every call in a sequence -- state established once
          and needed by every later call has to live somewhere that
          outlives any single call.
    - why of:
          value: mcp_client_session_send_turn
          question: Why is `send_turn` a method on an instance rather than a free function?

reconnecting_per_call_loses_state_and_is_slow:
    - description: >
          Tearing down and re-establishing a connection on every call both
          repeats the full cost of that setup every time and discards
          whatever state the other end of the connection was holding for
          the ongoing interaction -- state a later call in the same
          interaction may depend on.
    - why of:
          value: session_scoped_state_must_persist_across_calls
          question: Why must connections and other per-session state persist across calls instead of being freshly established on each one?

disconnected_exchanges_arent_a_conversation:
    - description: >
          A sequence of calls that each start over from scratch is really
          a series of independent, single-shot exchanges -- not the same
          continuous, stateful interaction a real multi-turn conversation
          actually is, even when the same prompts are sent in the same
          order.
    - why of:
          value: reconnecting_per_call_loses_state_and_is_slow
          question: Why would losing state between calls be a problem worth avoiding, rather than just an added performance cost?

pytest_fail_integrates_with_test_reporting:
    - description: >
          Raising a failure through a test framework's own designated
          failure function reports it the same way any other assertion
          failure would, integrating directly into that framework's own
          reporting instead of requiring every caller to separately catch
          and translate a raised exception.
    - why of:
          value: mcp_client_session_send_turn
          question: Why does `send_turn` fail via `pytest.fail` instead of raising a plain exception on timeout/error?

failure_report_should_point_to_complete_record:
    - description: >
          A failure message is only as useful as the artifact it points a
          developer to; finalizing and flushing that artifact before
          reporting the failure that references it ensures nothing is
          still unwritten by the time someone goes to look.
    - why of:
          value: pytest_fail_integrates_with_test_reporting
          question: Why finalize and close the trace/usage record before reporting the failure, rather than reporting first?

explicit_finalization_avoids_implicit_ordering:
    - description: >
          Relying on a later, separate teardown step to eventually
          finalize something leaves the ordering between "report a
          failure" and "finalize what it points to" implicit and easy to
          get wrong; finalizing explicitly at the point of failure -- and
          making any later teardown call a safe no-op -- removes that
          ambiguity.
    - why of:
          value: failure_report_should_point_to_complete_record
          question: Why finalize explicitly at the point of failure rather than leaving it to a later teardown step?
          note: "A defensive-coding rationale, and a reasonable terminus for this line of reasoning."
