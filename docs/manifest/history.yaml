file_info:
    - description: >
          Everything pulled out of code comments and docstrings that
          doesn't fit in 2 lines, kept here instead of scattered across the
          codebase. In-file comments/docstrings are capped at 2 lines; the
          full version of anything longer lives in one of the two sections
          below, not restated in the code as a pointer -- if more depth on
          some entity is needed, look it up here by its own fully-qualified
          path (module.Class.method / module.CONSTANT), not by guessing a
          narrative title.
    - file_info

entity_notes:
    data:
        - description: >
              Full-length notes for a specific code entity, keyed by its
              fully-qualified dotted path exactly as it appears in the
              file (module.Class.method, module.Class.attribute, or
              module.CONSTANT). Present-tense: what the entity does and why
              it's shaped that way, not how it came to be -- that's
              project_history below instead.
    emc2p.testing.headless_session:
        - description: >
              Generic infrastructure for driving a real MCP server through
              a real MCP client -- HeadlessSession spawns a provider CLI as
              a subprocess against a caller-supplied .mcp.json, exactly the
              way a client connecting to that server would. Nothing here
              knows about any downstream project's MCP tool names, registry
              backend, or domain scenarios (see project_history.
              headless_session_generalized for where this started). A
              caller supplies mcp_config, allowed_tools, cwd, model, and
              any extra_env its own MCP server(s) need (e.g. a database URL
              derived from a save/workdir the caller picked) -- a
              downstream project typically wraps this in its own subclass
              or fixture that fixes these to its own defaults.
    emc2p.testing.headless_session._STRIP_BUILTIN_TOOLS_ARGS:
        - description: >
              --tools "" strips every built-in Claude Code tool (Bash,
              Read, Write, Edit, Glob, Grep, WebFetch, WebSearch, Task,
              ...), leaving only the caller's own allowed_tools -- not just
              denied via --disallowedTools, which still leaves every other
              built-in tool available. A model being tested for how it uses
              one project's MCP tools has no legitimate reason to reach for
              unrelated built-in tools; removing the option outright is
              more robust than a denylist of specific tool names, which
              only covers what's been caught happening so far (see
              project_history.strict_tool_isolation_incident for the full
              account of what a weak model did instead when it wasn't
              stripped).
    emc2p.testing.headless_session.HeadlessProvider.decode_result_event:
        - description: >
              Return normalized result event dict, or None for non-result
              lines. Normalized shape: {"kind": "result" | "error",
              "result": str (for kind == "result"), "error": str (for kind
              == "error"), "total_cost_usd": float, "usage": {
              "input_tokens": int, "output_tokens": int,
              "cache_read_input_tokens": int, "cache_creation_input_tokens":
              int}, "duration_api_ms": int}.
    emc2p.testing.headless_session.ClaudeHeadlessProvider.filter_env:
        - description: >
              Dropping every CLAUDE*/AI_AGENT env var (not just adding
              extra_env on top) is load-bearing, not cosmetic -- confirmed
              live: run from inside a Claude Code Cloud session, this
              process's own environment carries CLAUDE_CODE_SESSION_ID
              (plus its messaging socket/token, oauth fd, container id,
              ...) for *this* session. Passed through via a plain
              {**os.environ, ...}, the nested claude -p subprocess picked
              that session ID up and attached to this exact outer session's
              own transcript/state instead of starting a fresh, isolated
              one. A local terminal invocation never had these vars set in
              the first place, which is presumably why this went unnoticed
              until first run from a Cloud session.
    emc2p.testing.headless_session.HeadlessSession:
        - description: >
              One continuously-running provider process, driven over
              stream-json. Unlike separate one-shot calls, this keeps a
              single MCP server child process alive for the whole `with`
              block, so send_turn's caller can inspect whatever state that
              server manages in between turns while it's still holding it
              open, and so the test itself can pace the conversation rather
              than handing the model a single "do everything" prompt with
              no chance to inspect state along the way.
    emc2p.testing.headless_session.HeadlessSession.__init__:
        - description: >
              mcp_config: Path (absolute, or relative to cwd) to the
              .mcp.json describing the MCP server(s) under test.
              allowed_tools: The mcp__<server>__*-style tool patterns this
              session may call -- passed straight to claude -p
              --allowedTools. cwd: Working directory claude -p is spawned
              in (its own .mcp.json resolution, and typically the repo
              whose MCP server(s) are under test). model: claude -p --model
              value, e.g. a specific model ID. provider: Which headless
              client provider to run -- "claude" (default), "copilot", or a
              custom HeadlessProvider implementation. provider_options:
              Provider-specific command/flag overrides.
              strict_tool_isolation: If True, ask provider to strip or
              otherwise constrain built-in tools; providers that cannot
              hard-enforce this receive an explicit prompt preamble
              fallback listing the allowed tools. extra_env: Extra
              environment variables the spawned process needs beyond a
              filtered copy of this process's own environment (see
              __enter__ for what's filtered out) -- e.g. a database URL a
              caller's MCP server(s) need, derived from whatever
              workdir/save the caller picked before this session was
              constructed. trace_dir: Directory every raw stream-json line
              is appended to, one file per session -- not just the final
              narrated result; diagnosing live-test flakiness needs the
              intermediate thinking/tool_use/tool_result payloads, not only
              send_turn's own return value. Defaults to .live_test_traces
              under cwd. Gitignored by convention -- these are per-run
              debug artifacts, not source. turn_timeout: Seconds to wait
              for a single send_turn's reply. session_timeout: Seconds
              bounding the whole session's wall-clock runtime (every
              send_turn call combined), not just a single one -- the
              backstop for a model that's technically still replying within
              each turn_timeout but never doing anything useful.
    emc2p.testing.headless_session.HeadlessSession.total_cost_usd:
        - description: >
              Accumulated across every send_turn call this session makes (a
              session is usually several turns) -- each turn's "result"
              event already reports its own cost/usage (see send_turn),
              this just sums them so a caller can read one total for the
              whole session instead of re-deriving it from the trace file
              after the fact. Same accumulation applies to
              total_input_tokens/total_output_tokens/
              total_cache_read_tokens/total_cache_creation_tokens/
              total_duration_api_ms alongside it.
    emc2p.testing.headless_session.HeadlessSession.send_turn:
        - description: >
              Send one prompt on the ongoing conversation and block for its
              narrated reply. Every raw line read from the subprocess --
              not just the final result -- is appended to self.trace_path
              as it arrives, so a failure (or a passing-but-suspicious run)
              can be inspected after the fact instead of only ever seeing
              the narrated text this method returns.
    emc2p.testing.headless_session.HeadlessSession.usage_summary:
        - description: >
              This session's usage so far, summed across every send_turn
              call. duration_api_ms is time actually spent generating (the
              model's own "active" time), not this process's wall-clock
              time -- the metric that maps onto a usage-plan's
              hours-per-week allotment.
    emc2p.testing.headless_session.HeadlessSession._fail:
        - description: >
              close() first, not stderr.read() first: read() blocks until
              EOF, which only arrives once the subprocess exits -- but the
              process is still alive at this point (that's the whole
              reason _fail was called), and nothing kills it until close()
              runs. Reading before closing deadlocks forever, silently
              swallowing every timeout this method exists to enforce.
              close() sets self.proc to None, so the proc handle is
              captured first for the stderr read afterward.
    emc2p.testing.headless_session.HeadlessSession.close:
        - description: >
              The usage_path write (trace_path.with_suffix(".usage.json"))
              is unconditional -- not just when a caller bothers to read
              usage_summary() itself -- so every live test's spend is
              recoverable after the fact, matching how the raw trace itself
              is already kept regardless of whether a given test happens to
              fail.

project_history:
    data:
        - description: >
              Non-actionable historical record of how emc2p reached its
              current shape.
    keyed_subagent_loop_generalized:
        - description: >
              emc2p.agents.keyed_subagent.run_tool_calling_loop started as
              a downstream project's own "keyed_subagent" event responder:
              a nested specialist call on that project's own API key, no
              MCP round-trip, needing a judgment prompt answered by a model
              that could actually read/write its registry
              (view_registry/view_entity/update_registry/
              consolidate_review), not just narrate a decision for
              something else to apply. Confirmed live there that a
              tool-less completion structurally can't do that: 50 calls in
              one run, zero real writes, zero recorded progress -- the
              text kept describing outcomes that never got persisted, so
              the same events just kept getting re-asked until the run's
              own time budget ran out. Generalized into emc2p once it was
              clear the loop mechanics (model completion, tool dispatch,
              iteration cap, usage logging) had nothing to do with that
              project's own registry schema or session plumbing --
              matching how headless_session_generalized had already moved
              the same way.
    headless_session_generalized:
        - description: >
              emc2p.testing.headless_session.HeadlessSession started as a
              downstream project's own test harness for driving a real MCP
              client against its MCP server. Generalized into emc2p once
              mcp_config/allowed_tools/cwd/model/extra_env were pulled out
              as plain parameters instead of being hardcoded to one
              project's own tool names/registry backend/domain scenarios
              -- a downstream project now wraps this in its own subclass or
              fixture instead of it living there directly.
    headless_session_fail_deadlock_fixed:
        - description: >
              Before HeadlessSession moved into emc2p, its _fail() method
              read the failing subprocess's stderr (which blocks until
              EOF) before ever killing that process -- a deadlock, since
              EOF only arrives once the process exits, and nothing killed
              it until after that read. Confirmed live: every timeout in
              the harness silently hung instead of firing until this was
              fixed (close() the process first, then read stderr from the
              already-terminated handle).
    strict_tool_isolation_incident:
        - description: >
              _STRIP_BUILTIN_TOOLS_ARGS (--tools "" rather than a
              --disallowedTools denylist) exists because of one confirmed
              live incident: a weak model, hitting an MCP tool timeout,
              used the Glob/Read built-in tools to go read the connected
              project's own source code, trying to self-diagnose the
              failure instead of retrying or reporting it -- burning the
              rest of the run on unrelated exploration instead of the MCP
              tools actually under test. A denylist would only ever cover
              tool names caught misused so far; stripping every built-in
              tool outright removes the option entirely.
    validate_write_checks_generalized:
        - description: >
              emc2p.validate_write's mechanical safety checks
              (find_component_named_as_nested_entity,
              find_unknown_component_types) were originally written inside
              a downstream project before being ported here once it became
              clear they were pure functions over already-parsed YAML plus
              a registry's own known component types, with nothing in them
              actually specific to that project's own domain.
