[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emc2p"
version = "0.1.0"
description = "Entity-Component System engine: registry, ETL, and dataflow execution"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3.2",
    "ibis-framework[duckdb]>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pandera[ibis]>=0.25.0",
    "pyyaml>=6.0",
    "sf-hamilton>=1.88.0",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# emc2p.testing (HeadlessSession, registry_checks) is meant to be used
# from a downstream project's own test suite, which already depends on pytest.
testing = [
    "pytest>=7.0.0",
]
# emc2p.agents (the tool_calling_loop module) is optional: only
# a project wiring an LLM up to a Registrar as a live agent needs litellm.
agents = [
    "litellm>=1.97.0",
]
# emc2p.mcp_server (a minimal MCP server exposing Registrar read/write
# tools directly) is optional: only needed to run/test that server itself,
# not to use Registrar/Registrar in-process.
mcp = [
    "mcp>=1.28.1,<2",
]

[project.scripts]
emc2p-mcp = "emc2p.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emc2p*"]

[tool.setuptools.package-data]
emc2p = ["builtins/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call a real model API (via a real CLI or litellm -- cost money, excluded from CI)",
    "slow: tests that go through the real load_manifest/from_manifest pipeline (Hamilton driver construction dominates, regardless of manifest size), spin up a real MCP-server subprocess, or otherwise individually take 1s+ -- numerous enough to dominate the full suite's wall time. Excluded by default (see addopts); run everything with `-m \"not live\"`.",
]
# Default `uv run pytest` run: fast, for iterating before a commit.
# Full run (slow tests included, still what CI runs): `uv run pytest -m "not live"`
# -- an explicit -m on the command line fully replaces this addopts value,
# so it isn't additive and doesn't need "or slow" spelled out.
addopts = ["-m", "not slow and not live"]
