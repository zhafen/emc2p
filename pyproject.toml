[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emc2p"
version = "0.1.0"
description = "Entity-Component System engine: registry, ETL, and dataflow execution"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3.2",
    "ibis-framework[duckdb]>=2.0.0",
    "pandas>=2.0.0",
    "pandera[ibis]>=0.25.0",
    "pyyaml>=6.0",
    "sf-hamilton>=1.88.0",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["emc2p*"]

[tool.setuptools.package-data]
emc2p = ["builtins/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
