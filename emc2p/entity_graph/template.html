<title>Entity Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Layout: sticky header, then a vertical stack of entity cards; relations drawn as lanes in a left gutter. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #18212b; --muted: #5b6876; --line: #d3dae2;
  --accent: #2f4fd6; --accent-soft: #e2e8ff;
  --e-parent: #7d8b9b; --e-requirement: #b8620a; --e-solution: #17845f; --e-other: #8a5cc2; --q: #c2334d;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --gutter: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #18202a; --ink: #e2e8ef; --muted: #93a1af; --line: #2a3642;
  --accent: #8197ff; --accent-soft: #232c52;
  --e-parent: #6b7a8a; --e-requirement: #e39b4d; --e-solution: #3cc39a; --e-other: #b48ae8; --q: #ff7a8f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #18202a; --ink: #e2e8ef; --muted: #93a1af; --line: #2a3642;
  --accent: #8197ff; --accent-soft: #232c52;
  --e-parent: #6b7a8a; --e-requirement: #e39b4d; --e-solution: #3cc39a; --e-other: #b48ae8; --q: #ff7a8f; color-scheme: dark }
@media (min-width: 600px) { :root { --gutter: 120px } }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; }
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 600 20px/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.counts { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#search { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 15px var(--font-body); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip.edge[aria-pressed="false"] { opacity: .5; }
.sw { width: 14px; height: 3px; border-radius: 2px; }
.sep { flex: none; width: 1px; background: var(--line); margin-inline: 2px; }

main { padding-block: 8px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#list { position: relative; }
#edges { position: absolute; left: 0; top: 0; width: var(--gutter); overflow: visible; pointer-events: none; }
.group { margin: 18px 0 6px var(--gutter); font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.row { margin: 0 0 6px var(--gutter); position: relative; }
.card { display: grid; gap: 3px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; box-sizing: border-box; }
.card .top { display: flex; gap: 6px; align-items: center; min-width: 0; height: 20px; }
.name { font: 500 14px/20px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { flex: none; font: 600 10px/1 var(--font-mono); letter-spacing: .05em; padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; }
.b-REQ { color: var(--e-requirement); } .b-SOL { color: var(--e-solution); } .b-TYPE { color: var(--accent); } .b-Q { color: var(--q); }
.details { display: none; position: absolute; right: 8px; top: 7px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; }
.row.sel .details { display: block; }
.row.sel .name { padding-right: 70px; }
.row.sel .card { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.row.nb .card { border-color: var(--accent); }
.has-sel .row:not(.sel):not(.nb) .card { opacity: .55; }
#edges .base { transition: opacity .15s; }
.has-sel #edges .base { opacity: .22; }
.empty { margin-left: var(--gutter); color: var(--muted); padding: 24px 0; }

#sheet { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: 62vh; background: var(--surface);
  border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .18);
  display: flex; flex-direction: column; transform: translateY(105%); transition: transform .22s ease, height .22s ease; }
#sheet.open { transform: none; }
#sheet.tall { height: 90vh; }
.handle { flex: none; display: grid; place-items: center; height: 26px; cursor: grab; touch-action: none; border: 0; background: none; width: 100%; }
.handle::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet-body { overflow-y: auto; padding-block: 4px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.sheet-open main { padding-bottom: 64vh; }
.close { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 8px; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 8px; }
.s-name { font: 600 18px/1.3 var(--font-mono); margin: 4px 36px 4px 0; overflow-wrap: anywhere; }
.s-path { font: 12px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
h2 { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
.comp { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 6px; }
.comp-type { font: 600 12px var(--font-mono); display: flex; gap: 8px; align-items: center; }
.comp-type .mod { font-weight: 400; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(70px, max-content) 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.text { font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; max-width: 65ch; }
.tag { font: 12px var(--font-mono); color: var(--muted); }
.ref { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 8px; font: 12.5px var(--font-mono);
  cursor: pointer; color: var(--accent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.reftype { font: 11px var(--font-mono); color: var(--muted); width: 100%; margin-top: 4px; }
.ov { display: grid; gap: 4px; font-size: 13px; }
.ov div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.ov span:last-child { font-family: var(--font-mono); color: var(--muted); }
.desk-only { display: none; }

@media (min-width: 900px) {
  #sheet { left: auto; top: 0; width: 400px; height: auto; border-radius: 0; border-top: 0; border-left: 1px solid var(--line);
    box-shadow: none; transform: none; padding-top: env(safe-area-inset-top, 0px); }
  #sheet.tall { height: auto; }
  .handle { display: none; }
  .sheet-body { padding-top: 16px; }
  header, main { margin-right: 400px; }
  body.sheet-open main { padding-bottom: 40px; }
  .desk-only { display: block; }
}
@media (prefers-reduced-motion: reduce) { #sheet, #edges .base { transition: none; } }
</style>

<header>
  <div class="titlebar"><h1>Entity Graph</h1><span class="counts" id="counts"></span></div>
  <input id="search" type="search" placeholder="Search entities, descriptions…" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>
<main><div id="list"><svg id="edges"></svg></div></main>
<aside id="sheet" aria-label="Entity details">
  <button class="handle" id="handle" aria-label="Expand or collapse details"></button>
  <button class="close" id="close" aria-label="Close details">×</button>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = (n, t) => n.components.some(c => c.type === t);
const fileLabel = f => !f ? 'unknown' : f.startsWith('builtins.') ? f.slice(9) + ' (builtin)' : f.split('/').pop();
const edgeColor = t => ['parent','requirement','solution'].includes(t) ? `var(--e-${t})` : 'var(--e-other)';
const kinds = n => [has(n,'requirement')&&'REQ', has(n,'solution')&&'SOL', has(n,'component_type')&&'TYPE'].filter(Boolean);
const openQs = n => n.components.filter(c => c.type === 'question' && c.fields.status !== 'answered').length;
const qBadge = n => { const k = openQs(n); return k ? `<span class="badge b-Q" title="${k} open question${k > 1 ? 's' : ''}">?${k}</span>` : ''; };
const descOf = n => (n.components.find(c => c.type === 'description') || {fields:{}}).fields.value || '';

DATA.nodes.forEach(n => { n.out = []; n.in = []; n.kids = []; });
DATA.edges.forEach(e => { byId.get(e.source).out.push(e); byId.get(e.target).in.push(e); });
DATA.nodes.forEach(n => {
  const ps = n.components.filter(c => c.type === 'parent' && byId.has(c.fields.parent_eid));
  const p = ps.find(c => c.fields.is_primary) || ps[0];
  n.pp = p ? p.fields.parent_eid : null;
  if (n.pp) byId.get(n.pp).kids.push(n);
});
const size = (n, st = new Set()) => { if (n.size != null) return n.size; if (st.has(n.id)) return 0; st.add(n.id); return n.size = 1 + n.kids.reduce((t, k) => t + size(k, st), 0); };
DATA.nodes.forEach(n => size(n));
const FIRST = 'docs/manifest/emc2p.yaml';
const bySize = (a, b) => b.size - a.size || a.name.localeCompare(b.name);
const cmp = (a, b) => (b.file === FIRST) - (a.file === FIRST) || (a.file || '').localeCompare(b.file || '') ||
  has(b, 'requirement') - has(a, 'requirement') || bySize(a, b);
const order = [], seen = new Set();
const visit = (n, d, g) => { if (seen.has(n.id)) return; seen.add(n.id); n.depth = d; n.group = g; order.push(n); n.kids.sort(bySize).forEach(k => visit(k, d + 1, g)); };
DATA.nodes.filter(n => !n.pp).sort(cmp).forEach(n => visit(n, 0, n.file));
DATA.nodes.filter(n => !seen.has(n.id)).sort(cmp).forEach(n => visit(n, 0, n.file));

const FILES = [...new Set(order.map(n => n.group))];
const ETYPES = [...new Set(DATA.edges.map(e => e.type))];
const state = { q: '', file: null, etypes: new Set(ETYPES), sel: null };

// Chips
const chips = document.getElementById('chips');
chips.innerHTML = `<button class="chip file" data-file="" aria-pressed="true">All files</button>` +
  FILES.map(f => `<button class="chip file" data-file="${esc(f)}" aria-pressed="false">${esc(fileLabel(f))}</button>`).join('') +
  `<span class="sep"></span>` +
  ETYPES.map(t => `<button class="chip edge" data-etype="${esc(t)}" aria-pressed="true"><span class="sw" style="background:${edgeColor(t)}"></span>${esc(t)}</button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.etype) { const t = b.dataset.etype; state.etypes.has(t) ? state.etypes.delete(t) : state.etypes.add(t); b.setAttribute('aria-pressed', state.etypes.has(t)); draw(); return; }
  state.file = b.dataset.file || null;
  chips.querySelectorAll('.file').forEach(c => c.setAttribute('aria-pressed', (c.dataset.file || null) === state.file));
  applyFilter();
});

// List
const list = document.getElementById('list'), svg = document.getElementById('edges');
const rowEl = {}, groupEl = {};
let lastGroup;
const frag = document.createDocumentFragment();
order.forEach(n => {
  if (n.group !== lastGroup) {
    lastGroup = n.group;
    const h = document.createElement('div'); h.className = 'group'; h.textContent = fileLabel(n.group);
    groupEl[n.group] = h; frag.appendChild(h);
  }
  const r = document.createElement('div'); r.className = 'row'; r.dataset.id = n.id;
  const types = [...new Set(n.components.map(c => c.type))].join(' · ');
  r.innerHTML = `<button class="card" data-id="${n.id}"><span class="top">${kinds(n).map(k => `<span class="badge b-${k}">${k}</span>`).join('')}${qBadge(n)}<span class="name">${esc(n.name)}</span></span><span class="meta">${esc(types)}</span></button><button class="details" data-details="${n.id}">Details</button>`;
  rowEl[n.id] = r; frag.appendChild(r);
});
const emptyEl = document.createElement('div'); emptyEl.className = 'empty'; emptyEl.textContent = 'No entities match. Clear the search or pick another file.'; emptyEl.hidden = true;
frag.appendChild(emptyEl);
list.appendChild(frag);

function applyFilter() {
  const q = state.q.toLowerCase();
  let shown = 0;
  const groupShown = {};
  order.forEach(n => {
    const ok = (!state.file || n.group === state.file) &&
      (!q || (n.name + ' ' + (n.alias || '') + ' ' + descOf(n)).toLowerCase().includes(q));
    rowEl[n.id].hidden = !ok; if (ok) { shown++; groupShown[n.group] = true; }
  });
  Object.entries(groupEl).forEach(([g, el]) => el.hidden = !groupShown[g]);
  emptyEl.hidden = shown > 0;
  document.getElementById('counts').textContent = `${shown}/${order.length} entities · ${DATA.edges.length} links`;
  draw();
}
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value.trim(); applyFilter(); });

// Gutter edges: one lane per (target, type) bundle, greedy interval packing.
const PORT = 20, NS = 'http://www.w3.org/2000/svg';
let laneOf = new Map();
function draw() {
  const G = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gutter')) || 64;
  const y = new Map();
  order.forEach(n => { const r = rowEl[n.id]; if (!r.hidden) y.set(n.id, r.offsetTop + PORT); });
  const vis = DATA.edges.filter(e => state.etypes.has(e.type) && y.has(e.source) && y.has(e.target) && e.source !== e.target);
  // A parent edge whose pair also has a visible requirement/solution edge is drawn once, as the latter.
  const typed = new Set(vis.filter(e => e.type !== 'parent').map(e => e.source + '>' + e.target));
  const edges = vis.filter(e => e.type !== 'parent' || !typed.has(e.source + '>' + e.target));
  const bundles = new Map();
  edges.forEach(e => { const k = e.target + '|' + e.type; if (!bundles.has(k)) bundles.set(k, { target: e.target, type: e.type, src: [] }); bundles.get(k).src.push(e.source); });
  const bs = [...bundles.values()];
  bs.forEach(b => { const ys = [y.get(b.target), ...b.src.map(s => y.get(s))]; b.lo = Math.min(...ys); b.hi = Math.max(...ys); });
  bs.sort((a, b) => (a.hi - a.lo) - (b.hi - b.lo));
  const lanes = [];
  bs.forEach(b => {
    let i = lanes.findIndex(l => l.every(o => b.hi + 6 < o.lo || b.lo - 6 > o.hi));
    if (i < 0) { i = lanes.length; lanes.push([]); }
    lanes[i].push(b); b.lane = i;
  });
  const step = Math.min(10, (G - 16) / Math.max(1, lanes.length));
  const X = l => G - 12 - l * step;
  laneOf = new Map(); bs.forEach(b => laneOf.set(b.target + '|' + b.type, b));
  svg.setAttribute('height', list.scrollHeight); svg.setAttribute('viewBox', `0 0 ${G} ${list.scrollHeight}`);
  let out = '<g class="base" fill="none" stroke-width="1.5" stroke-linecap="round">';
  bs.forEach(b => {
    const x = X(b.lane), c = edgeColor(b.type), yt = y.get(b.target);
    let d = `M${x} ${b.lo}V${b.hi}`;
    b.src.forEach(s => d += `M${x} ${y.get(s)}H${G - 1}`);
    d += `M${x} ${yt}H${G - 5}`;
    out += `<path d="${d}" stroke="${c}"/><path d="M${G - 6} ${yt - 4}L${G} ${yt}L${G - 6} ${yt + 4}Z" fill="${c}" stroke="none"/>`;
    b.src.forEach(s => out += `<circle cx="${x}" cy="${y.get(s)}" r="1.8" fill="${c}" stroke="none"/>`);
  });
  out += '</g>';
  if (state.sel && y.has(state.sel)) {
    out += '<g fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round">';
    edges.filter(e => e.source === state.sel || e.target === state.sel).forEach(e => {
      const x = X(laneOf.get(e.target + '|' + e.type).lane), ys = y.get(e.source), yt = y.get(e.target);
      out += `<path d="M${G - 1} ${ys}H${x}V${yt}H${G - 5}"/><path d="M${G - 6} ${yt - 4}L${G} ${yt}L${G - 6} ${yt + 4}Z" fill="var(--accent)" stroke="none"/>`;
    });
    out += '</g>';
  }
  svg.innerHTML = out;
}

// Selection + sheet
const sheet = document.getElementById('sheet'), body = document.getElementById('sheetBody');
function link(id) { const n = byId.get(id); return n ? `<button class="ref" data-id="${id}">${esc(n.name)}</button>` : esc(id); }
function fieldVal(k, v) {
  if (k.endsWith('_eid')) return link(v);
  if (typeof v === 'boolean') return `<span class="tag">${v}</span>`;
  return esc(typeof v === 'object' ? JSON.stringify(v) : v);
}
function renderComp(c) {
  const f = { ...c.fields }; const mod = f.modifier; delete f.modifier;
  Object.keys(f).forEach(k => { if (f[k] === '' || (k === 'value' && f.value_eid)) delete f[k]; });
  const keys = Object.keys(f);
  let inner;
  if (!keys.length) inner = '<span class="tag">tag</span>';
  else if (keys.length === 1 && keys[0] === 'value' && typeof f.value === 'string') inner = `<div class="text">${esc(f.value)}</div>`;
  else inner = `<dl class="kv">${keys.map(k => `<dt>${esc(k)}</dt><dd>${fieldVal(k, f[k])}</dd>`).join('')}</dl>`;
  return `<div class="comp"><div class="comp-type">${esc(c.type)}${mod ? `<span class="mod">${esc(mod)}</span>` : ''}</div>${inner}</div>`;
}
function overview() {
  const counts = {}; DATA.nodes.forEach(n => n.components.forEach(c => counts[c.type] = (counts[c.type] || 0) + 1));
  return `<div class="s-name">Overview</div><div class="s-path">emc2p builtins + docs/manifest</div>
    <h2>Totals</h2><div class="ov"><div><span>Entities</span><span>${DATA.nodes.length}</span></div><div><span>Links</span><span>${DATA.edges.length}</span></div><div><span>Open questions</span><span>${DATA.nodes.reduce((a, n) => a + openQs(n), 0)}</span></div></div>
    <h2>Components by type</h2><div class="ov">${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([t, c]) => `<div><span>${esc(t)}</span><span>${c}</span></div>`).join('')}</div>
    <h2>Using it</h2><div class="text">Tap an entity to highlight its links, then Details to see its components. Lines in the left gutter are relations: each lane ends in an arrow at the target, with a stub to every entity pointing at it.</div>`;
}
function renderSheet() {
  const n = byId.get(state.sel);
  if (!n) { body.innerHTML = overview(); return; }
  const inc = {}; n.in.forEach(e => (inc[e.type] = inc[e.type] || []).push(e.source));
  body.innerHTML = `<div class="refs">${kinds(n).map(k => `<span class="badge b-${k}">${k}</span>`).join('')}${qBadge(n)}</div>
    <div class="s-name">${esc(n.name)}</div><div class="s-path">${esc(n.path)}</div>
    <h2>Components (${n.components.length})</h2>${n.components.map(renderComp).join('')}
    <h2>Referenced by (${n.in.length})</h2>${n.in.length ? Object.entries(inc).map(([t, ids]) => `<div class="refs"><span class="reftype">${esc(t)}</span>${ids.map(link).join('')}</div>`).join('') : '<span class="tag">nothing points here</span>'}`;
  body.scrollTop = 0;
}
function select(id, scroll, details) {
  if (id && !byId.has(id)) id = null;
  if (id && rowEl[id].hidden) { state.q = ''; document.getElementById('search').value = ''; state.file = null; chips.querySelectorAll('.file').forEach(c => c.setAttribute('aria-pressed', !c.dataset.file)); applyFilter(); }
  state.sel = id;
  document.querySelectorAll('.row.sel, .row.nb').forEach(r => r.classList.remove('sel', 'nb'));
  document.body.classList.toggle('has-sel', !!id);
  document.body.classList.toggle('sheet-open', !!(id && details));
  sheet.classList.toggle('open', !!(id && details));
  if (!(id && details)) sheet.classList.remove('tall');
  if (id) {
