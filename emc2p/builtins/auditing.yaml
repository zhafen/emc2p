file_info:
    - description: >
          Component types originally defined by iacs (github.com/zhafen/iacs)
          but generic enough to be useful to any project doing requirement/
          solution architecture and scoring, not just infrastructure-as-code
          specifically -- so they live here in emc2p rather than in iacs.
          This lets a project that depends on emc2p directly without also
          depending on iacs (e.g. story-simulator's own docs/manifest/
          story-simulator.yaml) get a real, validated schema for them
          instead of relying on emc2p's schema-optional duck-typing.

          Named for what these types are for (auditing/scoring candidate
          solutions against requirements), not for iacs itself -- iacs is
          just one of the projects that uses them.

          ``requirement`` used to be a scored/tagged component (parent:
          impact, fields type/value/schedule) rather than a relation. Once
          a need arose for an inverse of ((solution)) -- marking an entity
          as something another entity needs, not something it solves -- it
          made more sense for ``requirement`` itself to fill that role,
          with the same directed_relation shape and ``X of:`` syntax as
          ((solution)), rather than invent a separate, differently-named
          relation type. The old scored/tagged behavior moved to
          ((requirement_priority)) under its own name rather than being
          dropped; ``requirement_priority``'s own ``parent: impact`` still
          points at a type that remains iacs-only (not moved here): a
          project using ``requirement_priority`` without also depending on
          iacs won't have that parent resolve, same as before the move for
          any such project.
    - file_info

requirement:
    - description: >
          The inverse of ((solution)): marks the ((requirement.source)) as
          something the ((requirement)).value entity needs in order to
          function, rather than something it solves. The
          ((requirement.source)) is required by ((requirement)).value.
          Lets a solution's own requirements (and those requirements' own
          candidate solutions, and so on) be expressed purely through
          relations -- ((solution)) one way, ((requirement)) the other --
          without tagging any entity as categorically "a requirement" or
          "a solution" the way ((requirement_priority))/the ``- solution``
          tag convention does elsewhere.
    - parent: directed_relation
    - field:
          value:
              description: The entity that requires this entity to function.
              type: entity_ref
          selected:
              description: >
                  True when this is the requirement actually in use, among
                  multiple candidate requirements recorded for the same
                  target. Null/false otherwise -- absence doesn't imply
                  rejection, just that a choice hasn't been recorded yet.
              type: bool
              nullable: true

requirement_priority:
    - description: >
          Indicates that an entity represents a requirement that must be
          satisfied by the system design. Requirements should be traced to
          implementations.

          Formerly named ``requirement``; renamed to free that name up for
          the ((requirement))/((solution)) relation pair once requirements
          and solutions could be expressed purely through relations. Still
          the type to use for a scored/tagged requirement (priority, type,
          schedule) rather than a relation to some other entity.
    - parent: impact
    - field:
          type:
              description: The type of requirement.
              type: str
              range:
                  - functional
                  - quality
                  - constraint
              default: functional
          value:
              description: >
                  The priority/impact score for the requirement, with higher
                  values corresponding to higher priority.
              type: rating
              default: 0.5
          schedule:
              description: >
                  How often the requirement needs to be satisfied. If null, the
                  requirement needs to be satisfied on demand.
              type: timedelta
              default: null

solution:
    - description: >
          A solution relation is used to show a requirement is fulfilled.
          The ((solution.source)) solves the ((solution)).requirement.
    - parent: directed_relation
    - field:
          value:
              description: The entity that this solution targets (what is being solved).
              type: entity_ref
          selected:
              description: >
                  True when this is the solution actually in use, among
                  multiple candidate solutions recorded for the same
                  target. Null/false otherwise -- absence doesn't imply
                  rejection, just that a choice hasn't been recorded yet.
              type: bool
              nullable: true

dependence:
    - description: >
          Marks the ((dependence.source)) -- typically a selected
          ((solution)) -- as needing the ((dependence)).value entity to
          exist/be implemented before it can be considered realized.
          Unlike ((requirement))/((solution)), there's no inverse pair:
          a dependence only ever points one way, from the thing that
          needs something to the thing it needs, and doesn't carry a
          ``selected`` field of its own -- there's no "candidate
          dependencies to choose among" the way there are candidate
          solutions to a requirement. Distinct from ((requirement)) as
          well: a requirement is a need the design itself must satisfy
          (traded off against alternative solutions); a dependence is a
          concrete implementation artifact a chosen solution needs built.
    - parent: directed_relation
    - field:
          value:
              description: The entity that must exist for this entity to be realized.
              type: entity_ref

consideration:
    - description: A pro or con used to make a decision.
    - field:
          value:
              description: >
                  Key for the consideration, which should be a short
                  summary.
              type: str
          description:
              description: Elaborating on the key when necessary.
              type: str
          weight:
              description: How important this consideration is.
              type: float

consideration_rating:
    - field:
          value:
              description: >
                  Key for the consideration this rates. Optional: leave
                  null for a plain, uncategorized pro/con -- just "is this
                  strong or weak" -- with no shared axis to weigh it
                  against others by. A null value's effective weight
                  defaults to 1 (the same as an explicit consideration
                  with weight 1) rather than 0, so an uncategorized rating
                  still counts instead of vanishing from a weighted total.
              type: str
              nullable: true
          note:
              description: Notes on the rating.
              type: str
          rating:
              description: >
                  Positive ratings are pros, negative ratings are cons.
              type: float
              range: [-1, 1]
